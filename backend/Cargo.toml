[package]
name = "timesheet-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
argon2 = "0.5"
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
rust_decimal = { version = "1.42.1", features = ["serde-with-float"] }
serde = { version = "1.0.228", features = ["derive"] }
# Used to check that a full-replace PUT body actually carries every field,
# before it is deserialized into the typed payload.
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "rust_decimal"] }
tokio = { version = "1.52.3", features = ["full"] }
time = "0.3.55"
rust_xlsxwriter = "0.97.1"
# default-features = false keeps native-tls/OpenSSL out: the builder image has no
# libssl-dev, and rustls matches what sqlx already uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
