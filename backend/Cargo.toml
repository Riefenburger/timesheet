[package]
name = "timesheet-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rust_decimal = { version = "1.42.1", features = ["serde-with-float"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "rust_decimal"] }
tokio = { version = "1.52.3", features = ["full"] }
